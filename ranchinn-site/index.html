  <style>
    /* Base Custom Styling & Organic Texture */
    :root {
      --bg-linen: #F6F3EC;
      --text-olive: #1D281D;
    }

    body {
      background-color: var(--bg-linen);
      color: var(--text-olive);
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow-x: hidden;
      selection-background-color: #3B4F39;
      selection-color: #F6F3EC;
    }

    ::selection {
      background-color: #3B4F39;
      color: #F6F3EC;
    }

    /* Subtle Tactile Paper/Film Grain Overlay */
    .grain-overlay {
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.035'/%3E%3C/svg%3E");
    }

    /* Scroll-triggered Reveal Animations */
    .reveal {
      opacity: 0;
      transform: translateY(32px);
      transition: opacity 0.95s cubic-bezier(0.16, 1, 0.3, 1),
                  transform 0.95s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: opacity, transform;
    }

    .reveal.active {
      opacity: 1;
      transform: translateY(0);
    }

    .reveal-delay-1 { transition-delay: 120ms; }
    .reveal-delay-2 { transition-delay: 240ms; }
    .reveal-delay-3 { transition-delay: 360ms; }
    .reveal-delay-4 { transition-delay: 480ms; }

    /* Smooth Editorial Image Zoom */
    .editorial-img-wrap {
      overflow: hidden;
    }
    .editorial-img-wrap img {
      transition: transform 1.2s cubic-bezier(0.16, 1, 0.3, 1), filter 0.8s ease;
      will-change: transform;
    }
    .editorial-img-wrap:hover img {
      transform: scale(1.06);
    }

    /* Hero Subtle Ken Burns Effect */
    @keyframes slowZoom {
      0% { transform: scale(1); }
      100% { transform: scale(1.08); }
    }
    .animate-hero-bg {
      animation: slowZoom 24s ease-out forwards;
    }

    /* Lightbox Main Image Transition */
    .lightbox-stage-img {
      transition: opacity 0.38s cubic-bezier(0.16, 1, 0.3, 1),
                  transform 0.48s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: opacity, transform;
    }
    .lightbox-stage-img.switching {
      opacity: 0;
      transform: scale(1.03);
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #EFEAE0;
    }
    ::-webkit-scrollbar-thumb {
      background: #688264;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #3B4F39;
    }
  </style>
</head>

<body class="antialiased selection:bg-olive-700 selection:text-linen relative">

    /**
     * =========================================================================
     * DOM RENDERING ENGINE
     * Dynamically builds all sections from `ranchinnContent`
     * =========================================================================
     */
    function renderApplication(content) {
      renderNavbar(content);
      renderHero(content);
      renderManifesto(content);
      renderTimeline(content);
      renderExperiences(content);
      renderRecantos(content);
      renderPhilosophy(content);
      renderContact(content);
      renderFooter(content);

      // Initialize Lucide Icons after DOM injection
      if (window.lucide) {
        window.lucide.createIcons();
      }

      // Initialize Interactive Behaviors
      initScrollAnimations();
      initNavbarBehavior();
      initLightboxGallery(content);
      initContactForm(content);
    }

    /* 1. Render Floating Glassmorphic Navbar */

            return `

                ${item.label}
              </a>
            `;
          }
          return `
            <a href="${item.href}" class="text-linen/90 hover:text-linen text-sm font-normal tracking-wide transition-colors relative after:content-[''] after:absolute after:-bottom-1 after:left-0 after:w-0 after:h-[1.5px] after:bg-clay-light hover:after:w-full after:transition-all">
              ${item.label}
            </a>
          `;
        })
        .join('');

      const mobileLinksHtml = content.navigation
        .map(item => `
          <a href="${item.href}" class="mobile-nav-link block py-3 text-lg font-serif text-linen/90 hover:text-clay-light border-b border-linen/10 transition">

              <!-- Image Column -->
              <div class="reveal ${isEven ? 'lg:col-span-6 lg:order-2' : 'lg:col-span-6'}">
                <div class="relative rounded-3xl overflow-hidden shadow-editorial border border-olive-800/15 editorial-img-wrap group">
                  <img
                    src="${step.image}"
                    alt="${step.title}"
                    class="w-full h-[320px] sm:h-[390px] object-cover"

    /**
     * =========================================================================
     * INTERACTIVE BEHAVIORS & MICRO-INTERACTIONS
     * =========================================================================
     */

    /* Scroll Reveal & Top Progress Bar */
    function initScrollAnimations() {
      const reveals = document.querySelectorAll('.reveal');
      const observer = new IntersectionObserver(
        entries => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              entry.target.classList.add('active');
              observer.unobserve(entry.target);
            }
          });
        },
        { threshold: 0.12, rootMargin: '0px 0px -40px 0px' }
      );

      reveals.forEach(el => observer.observe(el));

      // Scroll Progress Bar
      const progressBar = document.getElementById('scroll-progress');
      window.addEventListener('scroll', () => {
        const scrollTop = window.scrollY;
        const docHeight = document.documentElement.scrollHeight - window.innerHeight;
        const progress = docHeight > 0 ? (scrollTop / docHeight) * 100 : 0;
        progressBar.style.width = `${progress}%`;
      }, { passive: true });
    }

    /* Navbar Scroll Compactness & Mobile Drawer */
    function initNavbarBehavior() {
      const navbarInner = document.getElementById('navbar-inner');
      const mobileBtn = document.getElementById('mobile-menu-btn');
      const mobileDrawer = document.getElementById('mobile-menu-drawer');
      const mobileLinks = document.querySelectorAll('.mobile-nav-link');

      window.addEventListener('scroll', () => {
        if (window.scrollY > 60) {
          navbarInner.classList.add('bg-olive-950/90', 'py-2.5', 'shadow-xl');
          navbarInner.classList.remove('bg-olive-950/65', 'py-3.5');
        } else {
          navbarInner.classList.remove('bg-olive-950/90', 'py-2.5', 'shadow-xl');
          navbarInner.classList.add('bg-olive-950/65', 'py-3.5');
        }
      }, { passive: true });

      if (mobileBtn && mobileDrawer) {
        mobileBtn.addEventListener('click', () => {
          mobileDrawer.classList.toggle('hidden');
        });
        mobileLinks.forEach(link => {
          link.addEventListener('click', () => {
            mobileDrawer.classList.add('hidden');
          });
        });
      }
    }

    /**
     * =========================================================================
     * IMMERSIVE SANCTUARY LIGHTBOX & PHOTO GALLERY ENGINE
     * Handles main image stage, thumbnail strip, prev/next buttons,
     * keyboard navigation (ESC, ArrowLeft, ArrowRight), and feature badges.
     * =========================================================================
     */
    function initLightboxGallery(content) {
      const modal = document.getElementById('detail-modal');
      const modalCard = document.getElementById('detail-modal-card');
      const modalImg = document.getElementById('modal-img');
      const modalCounter = document.getElementById('modal-counter');
      const modalStageBadge = document.getElementById('modal-stage-badge');
      const modalThumbnails = document.getElementById('modal-thumbnails');
      const modalPrev = document.getElementById('modal-prev');
      const modalNext = document.getElementById('modal-next');
      const modalBadge = document.getElementById('modal-badge');
      const modalTitle = document.getElementById('modal-title');
      const modalSubtitle = document.getElementById('modal-subtitle');
      const modalDesc = document.getElementById('modal-description');
      const modalFeatures = document.getElementById('modal-features');
      const modalClose = document.getElementById('modal-close');
      const modalCta = document.getElementById('modal-cta');

      let currentGallery = [];
      let currentPhotoIndex = 0;
      let currentTitle = '';
      let isModalOpen = false;

      // Render active photo on the main stage & update thumbnail active state
      function setStagePhoto(index, animate = true) {
        if (!currentGallery.length) return;

        // Wrap index around cleanly
        currentPhotoIndex = (index + currentGallery.length) % currentGallery.length;
        const targetUrl = currentGallery[currentPhotoIndex];

        if (animate) {
          modalImg.classList.add('switching');
          setTimeout(() => {
            modalImg.src = targetUrl;
            modalImg.alt = `${currentTitle} — Foto ${currentPhotoIndex + 1}`;
            modalImg.onload = () => {
              modalImg.classList.remove('switching');
            };
            // Fallback in case image is cached
            setTimeout(() => modalImg.classList.remove('switching'), 60);
          }, 160);
        } else {
          modalImg.src = targetUrl;
          modalImg.alt = `${currentTitle} — Foto ${currentPhotoIndex + 1}`;
        }

        // Update counter pill
        modalCounter.textContent = `${currentPhotoIndex + 1} / ${currentGallery.length}`;

        // Update active state on thumbnail strip
        const thumbButtons = modalThumbnails.querySelectorAll('.lightbox-thumb-btn');
        thumbButtons.forEach((btn, idx) => {
          if (idx === currentPhotoIndex) {
            btn.classList.add('ring-2', 'ring-clay-light', 'opacity-100', 'scale-[1.03]');
            btn.classList.remove('opacity-50', 'hover:opacity-85');
            btn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
          } else {
            btn.classList.remove('ring-2', 'ring-clay-light', 'opacity-100', 'scale-[1.03]');
            btn.classList.add('opacity-50', 'hover:opacity-85');
          }
        });
      }

      // Build clickable thumbnail strip
      function renderThumbnails(gallery, title) {
        modalThumbnails.innerHTML = gallery
          .map((imgUrl, idx) => `
            <button
              type="button"
              data-thumb-index="${idx}"
              aria-label="Ver foto ${idx + 1} de ${title}"
              class="lightbox-thumb-btn relative w-20 h-14 sm:w-24 sm:h-16 rounded-xl overflow-hidden shrink-0 transition-all duration-300 focus:outline-none ${
                idx === 0
                  ? 'ring-2 ring-clay-light opacity-100 scale-[1.03]'
                  : 'opacity-50 hover:opacity-85'
              }"
            >
              <img
                src="${imgUrl}"
                alt="${title} miniatura ${idx + 1}"
                class="w-full h-full object-cover"
              />
            </button>
          `)
          .join('');

        modalThumbnails.querySelectorAll('.lightbox-thumb-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            const idx = parseInt(btn.getAttribute('data-thumb-index'), 10);
            if (idx !== currentPhotoIndex) {
              setStagePhoto(idx, true);
            }
          });
        });
      }

      // Open Lightbox with normalized sanctuary or experience data
      function openLightbox(data) {
        currentGallery = Array.isArray(data.gallery) && data.gallery.length > 0
          ? data.gallery
          : [data.image];
        currentPhotoIndex = 0;
        currentTitle = data.title;
        isModalOpen = true;

        // Populate text & badges
        modalBadge.textContent = data.badge || '';
        modalStageBadge.textContent = data.badge || '';
        modalTitle.textContent = data.title || '';
        modalSubtitle.textContent = data.subtitle || '';
        modalDesc.textContent = data.detailedDescription || data.description || '';

        // Populate atmospheric features with subtle Lucide icons
        const featureIcons = ['sparkles', 'feather', 'trees', 'check-circle-2', 'sun', 'compass'];
        modalFeatures.innerHTML = (data.features || [])
          .map((feat, idx) => {
            const iconName = featureIcons[idx % featureIcons.length];
            return `
              <div class="flex items-start gap-2.5 p-3 rounded-xl bg-linen-warm/90 border border-olive-800/10 text-olive-900 text-xs sm:text-sm leading-snug">
                <i data-lucide="${iconName}" class="w-4 h-4 text-clay shrink-0 mt-0.5"></i>
                <span>${feat}</span>
              </div>
            `;
          })
          .join('');

        // Render thumbnails & set initial stage photo
        renderThumbnails(currentGallery, currentTitle);
        setStagePhoto(0, false);

        // Toggle prev/next visibility if only 1 image
        const showNav = currentGallery.length > 1;
        modalPrev.style.display = showNav ? 'flex' : 'none';
        modalNext.style.display = showNav ? 'flex' : 'none';

        // Re-init Lucide icons inside modal
        if (window.lucide) {
          window.lucide.createIcons();
        }

        // Lock body scroll & animate modal in
        document.body.style.overflow = 'hidden';
        modal.classList.remove('hidden');
        modal.classList.add('flex');
        requestAnimationFrame(() => {
          modal.classList.remove('opacity-0');
          modalCard.classList.remove('scale-95');
          modalCard.classList.add('scale-100');
        });
      }

      // Close Lightbox cleanly
      function closeLightbox() {
        if (!isModalOpen) return;
        isModalOpen = false;
        document.body.style.overflow = '';

        modal.classList.add('opacity-0');
        modalCard.classList.remove('scale-100');
        modalCard.classList.add('scale-95');
        setTimeout(() => {
          modal.classList.add('hidden');
          modal.classList.remove('flex');
        }, 280);
      }

      // Attach click listeners to all Sanctuary & Experience cards
      document.querySelectorAll('[data-modal-type]').forEach(card => {
        card.addEventListener('click', () => {
          const type = card.getAttribute('data-modal-type');
          const id = card.getAttribute('data-modal-id');

          if (type === 'sanctuary') {
            const space = content.sanctuaries.spaces.find(s => s.id === id);
            if (space) {
              openLightbox({
                badge: space.atmosphere,
                title: space.name,
                subtitle: space.tagline,
                detailedDescription: space.detailedDescription,
                features: space.features,
                gallery: space.gallery
              });
            }
          } else if (type === 'experience') {
            const item = content.experiences.items.find(x => x.id === id);
            if (item) {
              openLightbox({
                badge: item.badge,
                title: item.title,
                subtitle: item.shortDesc,
                detailedDescription: item.detailedDescription,
                features: item.features,
                gallery: item.gallery || [item.image]
              });
            }
          }
        });
      });

      // Prev / Next Button Listeners
      modalPrev.addEventListener('click', e => {
        e.stopPropagation();
        setStagePhoto(currentPhotoIndex - 1, true);
      });

      modalNext.addEventListener('click', e => {
        e.stopPropagation();
        setStagePhoto(currentPhotoIndex + 1, true);
      });

      // Close Controls: Top-Right X Button & Backdrop Click
      modalClose.addEventListener('click', closeLightbox);
      modal.addEventListener('click', e => {
        if (e.target === modal) closeLightbox();
      });

      // Keyboard Controls: ESC to close, Left/Right arrows to switch photos
      window.addEventListener('keydown', e => {
        if (!isModalOpen) return;
        if (e.key === 'Escape') {
          closeLightbox();
        } else if (e.key === 'ArrowLeft') {
          setStagePhoto(currentPhotoIndex - 1, true);
        } else if (e.key === 'ArrowRight') {
          setStagePhoto(currentPhotoIndex + 1, true);
        }
      });

      // CTA Button inside Lightbox pre-fills Contact Form
      modalCta.addEventListener('click', () => {
        const msgInput = document.getElementById('visitor-message');
        if (msgInput && !msgInput.value.trim()) {
          msgInput.value = `Olá! Explorei a galeria de "${currentTitle}" no Ranchinn e gostaria de conversar sobre um momento que imagino viver aí.`;
        }
        closeLightbox();
      });
    }

    /* Humanized Contact Form Actions (WhatsApp & Email) */
    function initContactForm(content) {
      let selectedIntention = content.contact.formLabels.intentions[0];
      const pills = document.querySelectorAll('.intention-pill');
      const btnWhatsapp = document.getElementById('btn-send-whatsapp');
      const btnEmail = document.getElementById('btn-send-email');
      const feedback = document.getElementById('contact-feedback');

      pills.forEach(pill => {
        pill.addEventListener('click', () => {
          pills.forEach(p => {
            p.classList.remove('bg-olive-800', 'text-linen', 'border-olive-800');
            p.classList.add('bg-linen', 'text-olive-900');
          });
          pill.classList.remove('bg-linen', 'text-olive-900');
          pill.classList.add('bg-olive-800', 'text-linen', 'border-olive-800');
          selectedIntention = pill.getAttribute('data-intention');
        });
      });

      function gatherFormValues() {
        const name = document.getElementById('visitor-name').value.trim();
        const contactInfo = document.getElementById('visitor-contact').value.trim();
        const message = document.getElementById('visitor-message').value.trim();

        if (!name || !message) {
          feedback.textContent = "Por favor, preencha seu nome e conte um pouco sobre o momento que você imagina viver aqui.";
          feedback.classList.remove('hidden', 'text-olive-700');
          feedback.classList.add('text-clay-dark');
          return null;
        }

        feedback.textContent = "Preparando sua mensagem com carinho...";
        feedback.classList.remove('hidden', 'text-clay-dark');
        feedback.classList.add('text-olive-700');

        return { name, contactInfo, message, selectedIntention };
      }

      btnWhatsapp.addEventListener('click', () => {
        const data = gatherFormValues();
        if (!data) return;

        const text = [
          `Olá, pessoal do *Ranchinn*! 🌿`,
          ``,
          `Me chamo *${data.name}* (${data.contactInfo || 'contato via WhatsApp'}).`,
          `*Semente / Ideia:* ${data.selectedIntention}`,
          ``,
          `*O momento que imagino viver aí:*`,
          `"${data.message}"`
        ].join('\n');

        const url = `https://wa.me/${content.contact.channels.whatsappNumber}?text=${encodeURIComponent(text)}`;
        window.open(url, '_blank', 'noopener,noreferrer');
      });

      btnEmail.addEventListener('click', () => {
        const data = gatherFormValues();
        if (!data) return;

        const subject = `Conversa com o Ranchinn — ${data.selectedIntention} (${data.name})`;
        const body = [
          `Olá, pessoal do Ranchinn!`,
          ``,
          `Nome: ${data.name}`,
          `Contato: ${data.contactInfo}`,
          `Intenção: ${data.selectedIntention}`,
          ``,
          `Sobre o momento que imagino viver no Ranchinn:`,
          `${data.message}`
        ].join('\n');

        window.location.href = `mailto:${content.contact.channels.emailAddress}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
      });
    }

    // Boot Application on DOMContentLoaded
    document.addEventListener('DOMContentLoaded', () => {
      renderApplication(ranchinnContent);
    });
  </script>
</body>
</html>
